name: H2B2A7 integridad de consolidacion

on:
  pull_request:
    branches: [develop]
    paths:
      - 'reports/H2B2A7_CONSOLIDACION/**'
      - 'scripts/auditar_sintesis_3d.py'
      - 'tests/test_integridad_3d.py'
      - '.github/workflows/h2b2a7-consolidacion-integridad.yml'
  push:
    branches: ['feature/h2b2a7-consolidacion']
    paths:
      - 'reports/H2B2A7_CONSOLIDACION/**'
      - 'scripts/auditar_sintesis_3d.py'
      - 'tests/test_integridad_3d.py'
      - '.github/workflows/h2b2a7-consolidacion-integridad.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integridad:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pruebas de auditoria
        run: python -m unittest discover -s tests -p test_integridad_3d.py -v
      - name: Verificar manifiestos y coherencia
        run: python scripts/auditar_sintesis_3d.py
